# Пример конфигурации frigate-to-tg.
# Значения ${VAR} и ${VAR:-default} подставляются из переменных окружения.

frigate:
  url: http://frigate:5000
  # авторизация (если Frigate закрыт логином): basic auth или токен
  # auth:
  #   user: ${FRIGATE_USER}
  #   password: ${FRIGATE_PASSWORD}
  #   token: ${FRIGATE_TOKEN}
  snapshot_quality: 80

mqtt:
  host: mqtt
  port: 1883
  # username: ${MQTT_USER}
  # password: ${MQTT_PASSWORD}
  prefix: frigate             # MQTT-префикс Frigate; события приходят в <prefix>/events
  tls: false

telegram:
  bot_token: ${TELEGRAM_BOT_TOKEN}
  # HTTP/SOCKS прокси для доступа к api.telegram.org, например:
  #   http://user:pass@proxy.local:3128  или  socks5://proxy.local:1080
  proxy_url: ${TELEGRAM_PROXY_URL:-}

alerts:
  # какие MQTT-действия отправлять: new, update, end
  actions: [update]
  one_alert_per_event: true   # одно событие = одно сообщение
  require_snapshot: true
  min_score: 0.7
  caption_format: "{camera}: {label} — {score}%"
  send_video_button: true     # кнопка "Видео" под фото (по запросу)
  video_max_mb: 45            # лимит для Telegram (боты могут до ~50 МБ)

groups:
  from_frigate: true          # читать camera_groups из конфига Frigate
  # дополнительные группы, которых нет в Frigate:
  # extra:
  #   front: [front_door_cam, porch_cam]

# Маршруты: чат + топик (message_thread_id) <- группы/камеры.
# chat_id группы Telegram берите со знаком минус (у ботов он вида -100xxxxxxxxxx).
# thread_id — id топика (виден в ссылке на сообщение топика).
routes:
  - chat_id: -1001234567890     # узнайте через /chatid в чате
    thread_id: 0                # 0 => без топика (общий чат)
    title: "Все камеры"
    groups: []          # пустой список + пустые cameras = все камеры
    objects: [person, car]
    min_score: 0.7

  # Пример: все камеры из frigate-группы "front" -> топик "Передняя дверь"
  # - chat_id: -1001234567890
  #   thread_id: 42
  #   title: "Передняя дверь"
  #   groups: [front]

  # Пример: конкретные камеры -> отдельный чат
  # - chat_id: -1001234567890
  #   cameras: [driveway_cam]
  #   send_video: true
